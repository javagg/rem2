[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/mesh",
    "crates/materials",
    "crates/bc",
    "crates/electrostatic",
    "crates/magnetostatic",
    "crates/eigenmode",
    "crates/driven",
    "crates/transient",
    "crates/result",
    "crates/cli",
    "crates/parallel",
    "crates/wasm",
    "crates/yew-app",
    "crates/touchstone",
    "crates/mom",
    "crates/bem",
    "crates/sbr",
    "vendor/rmetis",
]

# fem-rs sub-workspaces cannot be listed as members (separate workspace roots),
# but their crates are available as path dependencies below.

[workspace.dependencies]
# rem internal
rem-core      = { path = "crates/core" }
rem-config    = { path = "crates/config" }
rem-mesh      = { path = "crates/mesh" }
rem-materials = { path = "crates/materials" }
rem-bc            = { path = "crates/bc" }
rem-result        = { path = "crates/result" }
rem-electrostatic = { path = "crates/electrostatic" }
rem-magnetostatic = { path = "crates/magnetostatic" }
rem-eigenmode     = { path = "crates/eigenmode" }
rem-driven        = { path = "crates/driven" }
rem-parallel      = { path = "crates/parallel" }
rem-transient     = { path = "crates/transient" }
rem-mom           = { path = "crates/mom" }
rem-touchstone    = { path = "crates/touchstone" }
rem-sbr           = { path = "crates/sbr" }
rem-wasm          = { path = "crates/wasm" }
rmetis            = { path = "vendor/rmetis", default-features = false }

# fem-rs foundation crates (via vendor/fem-rs submodule)
fem-core     = { path = "vendor/fem-rs/crates/core" }
fem-linalg   = { path = "vendor/fem-rs/crates/linalg" }
fem-mesh     = { path = "vendor/fem-rs/crates/mesh" }
fem-element  = { path = "vendor/fem-rs/crates/element" }
fem-space    = { path = "vendor/fem-rs/crates/space" }
fem-assembly = { path = "vendor/fem-rs/crates/assembly" }
fem-solver   = { path = "vendor/fem-rs/crates/solver" }
fem-amg      = { path = "vendor/fem-rs/crates/amg" }
fem-io       = { path = "vendor/fem-rs/crates/io" }

wasm-bindgen      = "0.2"
console_error_panic_hook = "0.1"

# serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# numerics
nalgebra    = "0.33"
num-complex = "0.4"
num-traits  = "0.2"
bytemuck    = { version = "1", features = ["derive"] }
rayon       = "1.10"
glam        = { version = "0.29", features = ["serde"] }
criterion   = { version = "0.5", features = ["html_reports"] }

# error handling
thiserror = "1"
anyhow    = "1"

# logging
log        = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm]
inherits  = "release"
opt-level = "s"
lto       = true

