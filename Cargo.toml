[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/mesh",
    "crates/surface",
    "crates/materials",
    "crates/bc",
    "crates/electrostatic",
    "crates/magnetostatic",
    "crates/eigenmode",
    "crates/driven",
    "crates/transient",
    "crates/result",
    "crates/cli",
    "crates/parallel",
    "crates/wasm",
    "crates/touchstone",
    "crates/bem",
    "vendor/rmetis",
    "vendor/rmsh-model",
    "vendor/rmsh-io",
]
# yew-app excluded: depends on private rcad-render/rcad-kernel (SSH git dep)
# build yew-app separately from crates/yew-app/ with its own workspace
exclude = ["crates/yew-app"]

[workspace.package]
version = "0.17.1"
edition = "2021"

# fem-rs sub-workspaces cannot be listed as members (separate workspace roots),
# but their crates are available as path dependencies below.

[workspace.dependencies]
# rem internal
rem-core      = { path = "crates/core" }
rem-config    = { path = "crates/config" }
rem-mesh      = { path = "crates/mesh" }
rem-surface   = { path = "crates/surface" }
rem-materials = { path = "crates/materials" }
rem-bc            = { path = "crates/bc" }
rem-result        = { path = "crates/result" }
rem-electrostatic = { path = "crates/electrostatic" }
rem-magnetostatic = { path = "crates/magnetostatic" }
rem-eigenmode     = { path = "crates/eigenmode" }
rem-driven        = { path = "crates/driven" }
rem-parallel      = { path = "crates/parallel" }
rem-transient     = { path = "crates/transient" }
rem-bem           = { path = "crates/bem" }
rem-touchstone    = { path = "crates/touchstone" }
rem-wasm          = { path = "crates/wasm" }
rmetis            = { path = "vendor/rmetis", default-features = false }

# fem-rs foundation crates (via git dependency)
fem-core     = { git = "https://github.com/rem-rs/fem-rs.git", rev = "49fc64e" }
fem-linalg   = { git = "https://github.com/rem-rs/fem-rs.git", rev = "49fc64e" }
fem-mesh     = { git = "https://github.com/rem-rs/fem-rs.git", rev = "49fc64e" }
fem-element  = { git = "https://github.com/rem-rs/fem-rs.git", rev = "49fc64e" }
fem-space    = { git = "https://github.com/rem-rs/fem-rs.git", rev = "49fc64e" }
fem-assembly = { git = "https://github.com/rem-rs/fem-rs.git", rev = "49fc64e" }
fem-solver   = { git = "https://github.com/rem-rs/fem-rs.git", rev = "49fc64e" }
fem-amg      = { git = "https://github.com/rem-rs/fem-rs.git", rev = "49fc64e" }
fem-io       = { git = "https://github.com/rem-rs/fem-rs.git", rev = "49fc64e" }

# rmsh crates (vendored locally, stripped of rcad/STEP dependencies)
rmsh-io      = { path = "vendor/rmsh-io", default-features = false }
rmsh-model   = { path = "vendor/rmsh-model" }

wasm-bindgen      = "0.2"
console_error_panic_hook = "0.1"
jsmpi             = "0.1"

# serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# numerics
nalgebra    = "0.33"
num-complex = "0.4"
num-traits  = "0.2"
bytemuck    = { version = "1", features = ["derive"] }
rayon       = "1.10"
rustfft     = "6"
glam        = { version = "0.29", features = ["serde"] }
wgpu        = "27"
criterion   = { version = "0.5", features = ["html_reports"] }

# error handling
thiserror = "1"
anyhow    = "1"

# logging
log        = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm]
inherits  = "release"
opt-level = "s"
lto       = true

