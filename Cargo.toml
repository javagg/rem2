[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/mesh",
    "crates/materials",
    "crates/bc",
    "crates/electrostatic",
    "crates/magnetostatic",
    "crates/eigenmode",
    "crates/driven",
    "crates/result",
    "crates/cli",
    "crates/parallel",
    "crates/wasm",
    "crates/yew-app",
    "crates/mom",
    "crates/bem",
    "crates/sbr",
    "vendor/rmetis",
]

[workspace.dependencies]
# rem internal
rem-core      = { path = "crates/core" }
rem-config    = { path = "crates/config" }
rem-mesh      = { path = "crates/mesh" }
rem-materials = { path = "crates/materials" }
rem-bc            = { path = "crates/bc" }
rem-result        = { path = "crates/result" }
rem-electrostatic = { path = "crates/electrostatic" }
rem-magnetostatic = { path = "crates/magnetostatic" }
rem-eigenmode     = { path = "crates/eigenmode" }
rem-driven        = { path = "crates/driven" }
rem-parallel      = { path = "crates/parallel" }
rem-mom           = { path = "crates/mom" }
rem-sbr           = { path = "crates/sbr" }
rmetis            = { path = "vendor/rmetis", default-features = false }
wasm-bindgen      = "0.2"
console_error_panic_hook = "0.1"

# serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# numerics
nalgebra    = "0.33"
num-complex = "0.4"

# error handling
thiserror = "1"
anyhow    = "1"

# logging
log        = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm]
inherits  = "release"
opt-level = "s"
lto       = true
