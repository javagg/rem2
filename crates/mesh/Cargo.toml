[package]
name    = "rem-mesh"
version.workspace = true
edition = "2021"

[features]
# Enable METIS-based mesh partitioning via rmetis (pure-Rust).
# Use `metis` for native builds, `metis-wasm` for wasm32 targets.
metis      = ["dep:rmetis", "rmetis/std"]
metis-wasm = ["dep:rmetis", "rmetis/std", "rmetis/wasm"]

[dependencies]
rem-core    = { workspace = true }
rem-config  = { workspace = true }
rem-parallel = { workspace = true }
fem-mesh    = { workspace = true }
log         = { workspace = true }
rmetis      = { workspace = true, optional = true }
rmsh-io     = { workspace = true }
rmsh-model  = { workspace = true }
