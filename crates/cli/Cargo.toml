[package]
name    = "rem-cli"
version.workspace = true
edition = "2021"

[[bin]]
name = "rem"
path = "src/main.rs"

[dependencies]
rem-core          = { workspace = true }
rem-config        = { workspace = true }
rem-mesh          = { workspace = true, features = ["metis"] }
rem-materials     = { workspace = true }
rem-parallel      = { workspace = true }
rem-electrostatic = { workspace = true }
rem-magnetostatic = { workspace = true }
rem-eigenmode     = { workspace = true }
rem-driven        = { workspace = true }
rem-transient     = { workspace = true }
rem-bem           = { workspace = true }
clap              = { workspace = true }
anyhow            = { workspace = true }
env_logger        = { workspace = true }
log               = { workspace = true }
serde_json        = { workspace = true }
