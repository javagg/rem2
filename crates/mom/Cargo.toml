[package]
name    = "rem-mom"
version.workspace = true
edition = "2021"

[dependencies]
rem-core      = { workspace = true }
rem-config    = { workspace = true }
rem-mesh      = { workspace = true }
rem-parallel  = { workspace = true }
rem-touchstone = { workspace = true }
rem-layered-green = { workspace = true }
rustfft       = { workspace = true }
num-complex   = { workspace = true }
nalgebra      = { workspace = true }
thiserror     = { workspace = true }
log           = { workspace = true }

# Rayon only on non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

# Optional: wgpu compute shaders for true GPU acceleration.
# Enable with: cargo build --features rem-mom/wgpu-gpu
# When enabled, fill_impedance_wgpu() uses a WGSL compute shader instead of Rayon.
# Requires a wgpu-compatible adapter (Vulkan/Metal/DX12/WebGPU).
[features]
wgpu-gpu = ["dep:wgpu", "dep:pollster"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.wgpu]
version     = "22"
optional    = true
features    = ["wgsl"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.pollster]
version  = "0.3"
optional = true

[dev-dependencies]
approx = "0.5"
