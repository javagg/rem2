[package]
name    = "rem-mom"
version = "0.1.0"
edition = "2021"

[dependencies]
rem-core     = { workspace = true }
rem-config   = { workspace = true }
rem-mesh     = { workspace = true }
rem-parallel = { workspace = true }
num-complex  = { workspace = true }
thiserror    = { workspace = true }
log          = { workspace = true }
faer         = { version = "0.21", default-features = false, features = ["std", "linalg", "npy"] }

# Rayon only on non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
approx = "0.5"
