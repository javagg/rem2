[package]
name    = "rem-yew"
version.workspace = true
edition = "2021"

[dependencies]
yew          = { version = "0.21", features = ["csr"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys      = { version = "0.3", features = ["HtmlSelectElement", "HtmlInputElement"] }
gloo         = { version = "0.11", features = ["futures"] }
jsmpi        = { path = "../../vendor/rmetis/vendor/jsmpi" }
js-sys       = "0.3"
serde        = { workspace = true }
serde_json   = { workspace = true }
serde-wasm-bindgen = "0.6"
log          = { workspace = true }
console_log  = "1.0"
console_error_panic_hook = { workspace = true }
rem-wasm          = { workspace = true }

rem-mesh          = { workspace = true, features = ["metis-wasm"] }
