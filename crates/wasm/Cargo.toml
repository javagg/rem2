[package]
name    = "rem-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rem-core          = { workspace = true }
rem-config        = { workspace = true }
rem-mesh          = { workspace = true, features = ["metis-wasm"] }
rem-materials     = { workspace = true }
rem-parallel      = { workspace = true }
rem-electrostatic = { workspace = true }
rem-magnetostatic = { workspace = true }
wasm-bindgen      = { workspace = true }
serde             = { workspace = true }
serde-wasm-bindgen = "0.6"
log               = { workspace = true }
console_log       = "1.0"
console_error_panic_hook = { workspace = true }

# rem-sbr is WASM-compatible (rayon excluded via cfg in rem-sbr/Cargo.toml)
rem-sbr = { workspace = true }

# rem-mom uses faer which is not wasm32-compatible (u64 Index)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rem-mom = { workspace = true }
