[package]
name    = "rem-planar"
version.workspace = true
edition = "2021"
description = "Planar MoM + FFT solver for layered-medium circuits (Sonnet-compatible)"

[dependencies]
rem-core      = { workspace = true }
rem-config    = { workspace = true }
rem-mesh      = { workspace = true }
rem-parallel  = { workspace = true }
rem-touchstone = { workspace = true }
num-complex   = { workspace = true }
nalgebra      = { workspace = true }
thiserror     = { workspace = true }
log           = { workspace = true }
csv           = "1.3"
rustfft       = "6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
approx = "0.5"
